<!doctype html>
<html lang="en" class="ikr-theme-page" data-ikr-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changelog · Reading Helper</title>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="changelog.css">
  <link rel="stylesheet" href="changelog-editor.css">
  <script src="diagnostic-page-errors.js" defer></script>
  <script src="changelog.js" defer></script>
  <script src="changelog-editor.js" defer></script>
</head>
<body data-ikr-page="changelog">
  <main>
    <header class="page-header">
      <div class="brand"><img src="icons/icon128.png" width="45" height="45" alt=""><div><p class="eyebrow">iKnow! Reading Helper</p><h1>Changelog</h1></div></div>
      <div class="ikr-page-actions"><button id="edit-changelog" class="changelog-edit-trigger" type="button" hidden>Edit</button><a href="study.html">Study library <span aria-hidden="true">↗</span></a><span data-ikr-theme-picker></span></div>
    </header>
    <section class="changelog-intro" aria-label="About these updates">
      <div><p class="intro-label">Release notes</p><h2>Latest updates</h2><p>Features, fixes and improvements.</p></div>
      <span id="changelog-installed" class="installed-version">Reading Helper</span>
    </section>
    <p id="changelog-draft-status" class="changelog-draft-status" role="status" hidden></p>
    <p id="changelog-status" class="changelog-status" role="status" aria-live="polite">Loading changelog…</p>
    <div id="changelog-layout" class="changelog-layout" hidden>
      <aside class="changelog-sidebar"><p class="sidebar-label">On this page</p><nav id="changelog-nav" aria-label="Changelog entries"></nav><p class="sidebar-note">Changes appear here with each published update.</p></aside>
      <section id="changelog-entries" class="changelog-entries" aria-label="Release history"></section>
    </div>
    <footer class="page-footer"><span>iKnow! Reading Helper</span><span id="changelog-count"></span></footer>
  </main>
  <dialog id="changelog-image-dialog" aria-label="Changelog image">
    <button id="changelog-image-close" class="image-close" type="button" aria-label="Close image"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button>
    <figure><img id="changelog-image-full" alt=""><figcaption id="changelog-image-caption"></figcaption></figure>
  </dialog>
</body>
</html>
